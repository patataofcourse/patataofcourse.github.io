# The URL the site will be built for
base_url = "https://patataofcourse.github.io"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "after-dark"

title = "patat's pile of cables"

taxonomies = [
    {name = "categories"},
    {name = "tags"},
]

[markdown]
highlight_code = true
highlight_theme = "one-dark"

[[extra.after_dark_menu]]
url = "$BASE_URL"
name = "Home"

[[extra.after_dark_menu]]
url = "$BASE_URL/projects"
name = "My projects"

[[extra.after_dark_menu]]
url = "$BASE_URL/blog"
name = "Blog"

[[extra.after_dark_menu]]
url = "$BASE_URL/support-me"
name = "Support me!"

[extra]
codeblock = true
after_dark_title = "patataofblog"
author = "patataofcourse"